<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام متابعة الشحنات والتخليص الجمركي | Shipment Management Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- مكتبة تصدير وقراءة الإكسيل SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#142b4a;--blue:#235b91;--teal:#0f9d8a;--bg:#f3f6fa;--card:#fff;--ink:#1b2b40;--muted:#708198;--line:#e3eaf1;--red:#c64747;--gold:#b7791f;--green:#2e7d32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.primary{background:var(--teal);color:#fff}.secondary{background:#eaf1f8;color:var(--navy)}.danger{background:#fff0f0;color:var(--red)}.ghost{background:transparent;color:var(--muted)}
#app{display:block;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.topbrand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}.topbrand .brand-mark{width:38px;height:38px;font-size:18px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 68px)}
.sidebar{background:var(--navy);padding:20px 14px;color:#d8e5f2}.side-title{font-size:11px;color:#8ea8c1;padding:12px 12px 7px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:right;background:transparent;color:#d8e5f2;margin:3px 0;padding:11px 13px;border-radius:10px;font-weight:600}
.nav.active,.nav:hover{background:#ffffff19;color:#fff}.nav span:first-child{width:22px;text-align:center}
.main{padding:26px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.pagehead h1{font-size:23px;margin:0;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px #183b5b08}
.stat small{color:var(--muted);font-weight:600}.stat strong{display:block;font-size:24px;color:var(--navy);margin-top:6px}
.panel{margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h3{font-size:16px;margin:0;color:var(--navy)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:280px}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}
th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;white-space:nowrap}
th{background:#f8fafc;color:#475569;font-weight:700;border-bottom:2px solid var(--line)}
tbody tr:nth-child(even){background-color:#fbfcfd}
tbody tr:hover{background-color:#f1f5f9}
td .actions{display:flex;gap:6px}
.pill{display:inline-block;border-radius:30px;padding:4px 10px;background:#eaf5f3;color:#087c6c;font-size:12px;font-weight:700}
.pill-alert{background:#fff0f0;color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
.empty{text-align:center;padding:40px;color:var(--muted);font-weight:600}
.modal{display:none;position:fixed;inset:0;background:#0b1d2f88;z-index:10;padding:20px;overflow:auto}.modal.show{display:grid;place-items:start center}
.modal-box{width:min(900px,100%);background:#fff;border-radius:18px;padding:22px;margin:30px auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:700;color:#334e68}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f9d8a18}
.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}
.notice{padding:12px 16px;border-radius:12px;background:#fff8e8;color:#8b5c11;font-size:13px;margin:12px 0;border-right:4px solid var(--gold)}
.alert-box{padding:14px 18px;border-radius:14px;background:#fff0f0;color:#9c27b0;font-size:14px;margin-bottom:12px;border-right:5px solid var(--red);display:flex;align-items:center;justify-content:space-between}
.alert-box.gold{background:#fffbf0;color:#8b5c11;border-right-color:var(--gold)}
#toast{position:fixed;bottom:20px;left:20px;background:#142b4a;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:30;box-shadow:0 8px 30px #0002;max-width:min(500px,90vw)}
</style>
</head>
<body>

<div id="app">
 <header class="topbar">
  <div class="topbrand"><div class="brand-mark">↗</div><span>إدارة التخليص الشاملة | شركة الأمل الشريف</span></div>
  <div class="toolbar"><span id="userLabel" class="muted">علاء محمد سعيد</span><span id="roleLabel" class="pill">مسؤول التخليص</span><button class="secondary" onclick="window.print()">طباعة الشاشة</button></div>
 </header>
 <div class="layout">
  <aside class="sidebar">
   <div class="side-title">القائمة الرئيسية</div>
   <button class="nav active" data-page="dashboard"><span>▦</span>لوحة التحكم</button>
   <button class="nav" data-page="shipments"><span>🚢</span>إدارة الشحنات العامة</button>
   <button class="nav" data-page="export_subsidies"><span>📈</span>برنامج مساندة الصادرات</button>
   <button class="nav" data-page="bank_guarantees"><span>🏦</span>إدارة الضمانات والأمانات</button>
   <button class="nav" data-page="expenses"><span>💳</span>المصروفات والرسوم</button>
   <button class="nav" data-page="invoices"><span>🧾</span>فواتير الموردين</button>
   <button class="nav" data-page="brokers"><span>🏢</span>مكاتب التخليص</button>
   <button class="nav" data-page="suppliers"><span>📦</span>إدارة الموردين</button>
   <button class="nav" data-page="reports"><span>📊</span>تقارير الشاشات (Excel)</button>
  </aside>
  <main class="main">
   <div class="pagehead">
    <h1 id="pageTitle">لوحة التحكم</h1>
    <div class="toolbar">
     <button id="downloadTemplateBtn" class="secondary" style="display:none; background:#e0f2fe; color:#0369a1;" onclick="downloadExcelTemplate()">📥 تحميل نموذج Excel</button>
     <label id="importExcelBtnWrap" class="secondary" style="display:none; cursor:pointer; padding:10px 16px; border-radius:10px; font-weight:700; background:#eaf1f8; color:var(--navy);">
      📂 استيراد من Excel <input type="file" id="importExcelFile" accept=".xlsx, .xls, .csv" style="display:none" onchange="importExcelData(event)">
     </label>
     <button class="primary" id="addBtn" style="display:none;">＋ إضافة جديد</button>
    </div>
   </div>

   <section id="dashboardPage">
    <div class="cards">
     <div class="stat"><small>إجمالي الشحنات العامة</small><strong id="sShipments">—</strong></div>
     <div class="stat"><small>ملفات دعم الصادرات</small><strong id="sSubsidies" style="color:var(--teal)">—</strong></div>
     <div class="stat"><small>إجمالي الضمانات والأمانات</small><strong id="sGuarantees" style="color:var(--gold)">—</strong></div>
     <div class="stat"><small>إجمالي المصروفات (جنيه)</small><strong id="sExpenses">—</strong></div>
    </div>
    <div class="panel">
     <div class="panel-head">
      <h3>أحدث شحنات ومستندات التخليص المسجلة</h3>
      <button class="secondary" onclick="showPage('shipments')">عرض الكل</button>
     </div>
     <div id="recentShipments"></div>
    </div>
   </section>

   <section id="listPage" style="display:none">
    <div class="cards" id="screenSummaryCards"></div>
    <div class="panel">
     <div class="panel-head">
      <h3 id="listHeading">السجلات</h3>
      <div class="toolbar"><input id="searchInput" placeholder="بحث سريع في البيانات..."><button class="secondary" id="refreshBtn">تحديث</button></div>
     </div>
     <div class="table-wrap" id="tableHost"></div>
    </div>
   </section>

   <section id="reportsPage" style="display:none">
    <div class="panel">
     <div class="panel-head">
      <h3>تقارير الشاشات الشاملة</h3>
      <div style="display: flex; gap: 8px;">
       <button onclick="window.print()" class="secondary">🖨️ طباعة التقرير</button>
       <button onclick="exportReportsToExcel()" class="primary">📥 تصدير (Excel)</button>
      </div>
     </div>
     <div style="margin-bottom:15px;">
      <label style="font-weight:bold;display:block;margin-bottom:5px;">اختر الشاشة المراد استخراج تقريرها:</label>
      <select id="repTargetTable" style="max-width:300px;" onchange="loadReportsData()">
       <option value="shipments">الشحنات العامة</option>
       <option value="export_subsidies">مساندة الصادرات</option>
       <option value="bank_guarantees">الضمانات والأمانات</option>
       <option value="expenses">المصروفات والرسوم</option>
      </select>
     </div>
     <div class="table-wrap">
      <table id="reportsTable">
       <thead><tr id="reportsHeaderRow"></tr></thead>
       <tbody id="reportsTableBody"></tbody>
      </table>
     </div>
    </div>
   </section>
  </main>
 </div>
</div>

<div class="modal" id="editModal">
 <div class="modal-box">
  <div class="panel-head"><h3 id="modalTitle">إضافة سجل</h3><button class="ghost" id="closeModal">✕</button></div>
  <form id="recordForm">
   <div id="formFields" class="form-grid"></div>
   <div class="modal-actions">
    <button class="primary" type="submit">حفظ البيانات</button>
    <button class="secondary" type="button" id="cancelModal">إلغاء</button>
   </div>
  </form>
 </div>
</div>

<div id="toast"></div>

<script type="module">

const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let page='dashboard',rows=[],editingId=null;
const $=id=>document.getElementById(id);

const config={

   ['status','حالة الشحنة','select',['جديدة','قيد المتابعة','في الطريق','وصلت الميناء','تم الإفراج','مغلقة']],
   ['notes','ملاحظات','textarea']
  ]
 },
 export_subsidies:{
  title:'برنامج مساندة الصادرات (دعم الصادرات)',
  table:'export_subsidies',
  cols:[['export_certificate_no','رقم شهادة الصادر'],['export_certificate_date','تاريخ الشهادة'],['company_factory_name','الشركة / المصنع'],['export_port','ميناء الصادر'],['efinance_request_no','رقم طلب e-finance'],['export_value_usd','قيمة الصادرات ($)'],['export_value_egp','القيمة بالجنيه'],['subsidy_rate_percent','نسبة الدعم (%)'],['expected_subsidy_value','الدعم المستحق (تقديري)'],['file_status','موقف الملف'],['disbursement_date','تاريخ الصرف'],['disbursed_amount','المبلغ المصروف فعلياً'],['notes','ملاحظات']],
  fields:[
   ['export_certificate_no','رقم شهادة الصادر (الصادر النهائي)','text'],
   ['export_certificate_date','تاريخ شهادة الصادر','date'],
   ['company_factory_name','الشركة / المصنع المصدر','text'],
   ['export_port','جمرك / ميناء المغادرة','text'],
   ['efinance_request_no','رقم الطلب / التسجيل (e-finance)','text'],
   ['export_value_usd','إجمالي قيمة الصادرات ($)','number'],
   ['export_value_egp','إجمالي القيمة بالجنيه المصري','number'],
   ['subsidy_rate_percent','نسبة رد الأعباء المستحقة (%)','number'],
   ['expected_subsidy_value','قيمة الدعم المستحق التقديرية','number'],
   ['file_status','موقف وحالة الملف','select',['مستندات تحت التجهيز','تم التسليم للهيئة','قيد المراجعة والتدقيق','تمت الموافقة وفي انتظار الصرف','تم الصرف الفعلي','مرفوض / يحتاج استكمال']],
   ['disbursement_date','تاريخ الصرف الفعلي','date'],
   ['disbursed_amount','المبلغ المصروف بالفعل (جنيه)','number'],
   ['notes','ملاحظات وتفاصيل المستندات','textarea']
  ]
 },
 bank_guarantees:{
  title:'إدارة الضمانات والأمانات',
  table:'bank_guarantees',
  cols:[['letter_or_receipt_no','رقم الخطاب / الإيصال'],['bank_name','البنك / الجهة'],['guarantee_type','نوع الضمان'],['shipment_release_no','رقم الشحنة / الإفراج'],['guarantee_value','قيمة الضمان'],['refunded_value','المبلغ المسترد'],['issue_date','تاريخ الإصدار'],['expiry_date','تاريخ الانتهاء'],['status','حالة الضمان'],['notes','ملاحظات']],
  fields:[
   ['letter_or_receipt_no','رقم خطاب الضمان / رقم الإيصال','text'],
   ['bank_name','البنك / الجهة المصدرة','text'],
   ['guarantee_type','نوع الضمان','select',['خطاب ضمان بنكي','أمانة نقدية جمركية','تعهد مصلحة الجمارك','أخرى']],
   ['shipment_release_no','رقم الإفراج / الشحنة المرتبطة','text'],
   ['guarantee_value','القيمة الإجمالية للضمان (جنيه)','number'],
   ['refunded_value','القيمة المستردة / المتممة','number'],
   ['issue_date','تاريخ إصدار الضمان','date'],
   ['expiry_date','تاريخ انتهاء الضمان','date'],
   ['status','حالة الضمان الحالية','select',['ساري','قيد التجديد والتمديد','تم الإفراج والاسترداد','تم التسييل','مغلق']],
   ['notes','ملاحظات ومتابعة البنك','textarea']
  ]
 },
 expenses:{
  title:'المصروفات والرسوم',
  table:'shipment_expenses',
  cols:[['expense_date','التاريخ'],['expense_type','بند المصروف'],['amount_egp','المبلغ بالجنيه'],['receipt_no','رقم الإيصال'],['notes','ملاحظات']],
  fields:[
   ['expense_date','التاريخ','date'],
   ['expense_type','بند المصروف','text'],

  ]
 },
 invoices:{
  title:'فواتير الموردين',
  table:'supplier_invoices',
  cols:[['invoice_number','رقم الفاتورة'],['supplier_name','المورد'],['quantity','الكمية'],['invoice_date','التاريخ'],['notes','ملاحظات']],
  fields:[['supplier_name','اسم المورد','text'],['invoice_number','رقم الفاتورة','text'],['quantity','الكمية','number'],['invoice_date','تاريخ الفاتورة','date'],['notes','ملاحظات','textarea']]
 },
 brokers:{
  title:'مكاتب التخليص',
  table:'customs_brokers',
  cols:[['name','اسم المكتب'],['contact_person','مسؤول التواصل'],['phone','الهاتف'],['notes','ملاحظات']],
  fields:[['name','اسم المكتب','text'],['contact_person','مسؤول التواصل','text'],['phone','الهاتف','text'],['notes','ملاحظات','textarea']]
 },
 suppliers:{
  title:'الموردين',
  table:'suppliers',
  cols:[['name','اسم المورد'],['contact_person','مسؤول التواصل'],['phone','الهاتف'],['notes','ملاحظات']],

 }
};

function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

window.showPage = async function(p){
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));
 if(p==='dashboard'){
  page=p;
  $('pageTitle').textContent='لوحة التحكم';
  $('dashboardPage').style.display='block';
  $('listPage').style.display='none';
  $('reportsPage').style.display='none';
  $('addBtn').style.display='none';
  $('importExcelBtnWrap').style.display='none';
  $('downloadTemplateBtn').style.display='none';
  await dashboard();
 } else if(p==='reports'){
  page=p;
  $('pageTitle').textContent='تقارير الشاشات الشاملة';
  $('dashboardPage').style.display='none';
  $('listPage').style.display='none';
  $('reportsPage').style.display='block';
  $('addBtn').style.display='none';
  $('importExcelBtnWrap').style.display='none';
  $('downloadTemplateBtn').style.display='none';
  await loadReportsData();
 } else {
  await renderTable(p);
 }
}

async function renderTable(key){
 page=key;
 const c=config[key];
 $('pageTitle').textContent=c.title;
 $('listHeading').textContent=c.title;
 $('dashboardPage').style.display='none';
 $('reportsPage').style.display='none';
 $('listPage').style.display='block';
 $('addBtn').style.display='inline-block';
 $('importExcelBtnWrap').style.display='inline-block';
 $('downloadTemplateBtn').style.display='inline-block';

 const {data,error}=await db.from(c.table).select('*').order('created_at',{ascending:false}).limit(500);
 if(error){toast(error.message);return}
 rows=data||[];
 drawRows(key,rows);
}

function drawRows(key,data){
 const c=config[key];
 let html='<table><thead><tr>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>إجراءات التحكم</th></tr></thead><tbody>';
 for(const r of data){
  html+='<tr>';
  for(const [k] of c.cols){
   html+=`<td>${esc(r[k]||'—')}</td>`;
  }
  html+=`<td><div class="actions"><button class="secondary" data-edit="${r.id}">تعديل</button><button class="danger" data-del="${r.id}">حذف</button></div></td></tr>`;
 }
 html+='</tbody></table>';
 if(!data.length)html='<div class="empty">لا توجد سجلات مسجلة حتى الآن</div>';
 $('tableHost').innerHTML=html;
 $('tableHost').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(key,b.dataset.edit));
 $('tableHost').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRow(key,b.dataset.del))
}

async function loadReportsData(){
 const targetKey=$('repTargetTable').value;
 const c=config[targetKey];
 const {data,error}=await db.from(c.table).select('*').order('created_at',{ascending:false}).limit(500);
 if(error){toast(error.message);return;}
 const list=data||[];
 const headRow=$('reportsHeaderRow');
 const tbody=$('reportsTableBody');
 headRow.innerHTML='';
 tbody.innerHTML='';
 headRow.innerHTML=c.cols.map(col=>`<th>${col[1]}</th>`).join('');
 for(const item of list){
  let trHtml='<tr>';
  for(const [k] of c.cols){
   trHtml+=`<td>${esc(item[k]||'—')}</td>`;
  }
  trHtml+='</tr>';
  tbody.innerHTML+=trHtml;
 }
}

window.exportReportsToExcel=function(){
 const table=document.getElementById('reportsTable');
 if(!table) return;
 const targetKey=$('repTargetTable').value;
 const titleName=config[targetKey].title;
 const worksheet=XLSX.utils.table_to_sheet(table);
 if(!worksheet['!views']) worksheet['!views']=[];
 worksheet['!views'].push({RTL:true});
 const workbook=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(workbook, worksheet, titleName.slice(0, 30));
 const today=new Date().toISOString().split('T')[0];
 XLSX.writeFile(workbook, `تقرير_${titleName}_${today}.xlsx`);
 toast(`تم تصدير التقرير بنجاح!`);
}

window.downloadExcelTemplate = function(){
 const c = config[page];
 if(!c) return;
 const headers = c.fields.map(f => f[0]);
 const headerLabels = c.fields.map(f => f[1]);
 const wsData = [headerLabels, headers];
 const worksheet = XLSX.utils.aoa_to_sheet(wsData);
 if(!worksheet['!views']) worksheet['!views']=[];
 worksheet['!views'].push({RTL:true});
 const workbook = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(workbook, worksheet, c.title.slice(0, 30));
 XLSX.writeFile(workbook, `نموذج_${c.title}.xlsx`);
 toast('تم تحميل نموذج الإكسيل بنجاح!');
}

window.importExcelData = async function(event){
 const file = event.target.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload = async function(e){
  try {
   const data = new Uint8Array(e.target.result);
   const workbook = XLSX.read(data, {type: 'array'});
   const firstSheetName = workbook.SheetNames[0];
   const worksheet = workbook.Sheets[firstSheetName];
   const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
   if(json.length < 2){ toast('ملف الإكسيل فارغ!'); return; }
   const headers = json[1];
   const rowsData = json.slice(2);
   if(!headers || !rowsData.length){ toast('الملف لا يحتوي على بيانات صالحة!'); return; }
   toast('جاري استيراد البيانات للسحابة...');
   const c = config[page];
   let count = 0;
   for(const rowArr of rowsData){
    let cleanObj = {};
    for(let i=0; i<headers.length; i++){
     if(headers[i] && rowArr[i] !== undefined){ cleanObj[headers[i]] = rowArr[i]; }
    }
    if(Object.keys(cleanObj).length === 0) continue;
    const {error} = await db.from(c.table).insert(cleanObj);
    if(!error) count++;
   }
   toast(`تم استيراد ${count} سجل بنجاح!`);
   event.target.value = '';
   await renderTable(page);
  } catch(err){ toast('خطأ في قراءة ملف الإكسيل: ' + err.message); }
 };
 reader.readAsArrayBuffer(file);
}

async function dashboard(){
 const {data:sData}=await db.from('shipments').select('id');
 const {data:subData}=await db.from('export_subsidies').select('id');
 const {data:gData}=await db.from('bank_guarantees').select('guarantee_value');
 const {data:expData}=await db.from('shipment_expenses').select('amount_egp');

 $('sShipments').textContent=(sData||[]).length;
 $('sSubsidies').textContent=(subData||[]).length;
 $('sGuarantees').textContent=(gData||[]).reduce((a,x)=>a+Number(x.guarantee_value||0),0).toLocaleString()+' ج.م';
 $('sExpenses').textContent=(expData||[]).reduce((a,x)=>a+Number(x.amount_egp||0),0).toLocaleString()+' ج.م';
 
 const {data:recentList}=await db.from('shipments').select('*').order('created_at',{ascending:false}).limit(8);
 $('recentShipments').innerHTML = recentList && recentList.length ? 
  `<table><thead><tr><th>رقم الشحنة</th><th>المورد</th><th>ميناء الوصول</th><th>الحالة</th></tr></thead><tbody>` +
  recentList.map(x => `<tr>
   <td>${esc(x.shipment_no || '-')}</td>
   <td>${esc(x.supplier_name || '-')}</td>
   <td>${esc(x.arrival_port || '-')}</td>
   <td>${esc(x.status || '-')}</td>
  </tr>`).join('') + `</tbody></table>` : 
  '<div class="empty">لا توجد شحنات مسجلة حديثاً</div>';
}

async function openForm(key,id=null){
 const c=config[key],record=id?rows.find(x=>x.id===id):{};
 editingId=id;
 $('modalTitle').textContent=(id?'تعديل سجل':'إضافة سجل جديد');
 let html='';
 for(const [name,label,type,opts] of c.fields){
  let val=record?.[name]??'';
  let control='';
  if(type==='select')control=`<select name="${name}">${opts.map(o=>`<option value="${esc(o)}" ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type==='textarea')control=`<textarea name="${name}" rows="2">${esc(val)}</textarea>`;
  else control=`<input name="${name}" type="${type}" value="${esc(val)}">`;
  html+=`<div class="field ${type==='textarea'?'wide':''}"><label>${label}</label>${control}</div>`;
 }
 $('formFields').innerHTML=html;
 $('editModal').classList.add('show');
}

async function saveRecord(ev){
 ev.preventDefault();
 const key=page,c=config[key];
 const formElements = ev.target.elements;
 const obj = {};
 toast('جاري حفظ البيانات...');
 for(const fieldConfig of c.fields){
  const name = fieldConfig[0];
  const el = formElements[name];
  if(!el) continue;
  if(el.value !== '') obj[name] = el.value;
  else obj[name] = null;
 }
 let q=editingId?db.from(c.table).update(obj).eq('id',editingId):db.from(c.table).insert(obj);
 const {error}=await q;
 if(error){toast(error.message);return}
 $('editModal').classList.remove('show');
 toast('تم الحفظ بنجاح!');
 await renderTable(key);
}

async function deleteRow(key,id){
 if(!confirm('هل أنت متأكد من الحذف؟'))return;
 const {error}=await db.from(config[key].table).delete().eq('id',id);
 if(error){toast(error.message);return}
 toast('تم الحذف بنجاح');
 await renderTable(key);
}

document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>showPage(n.dataset.page));
$('addBtn').onclick=()=>openForm(page);
$('closeModal').onclick=$('cancelModal').onclick=()=>$('editModal').classList.remove('show');
$('recordForm').onsubmit=saveRecord;
$('refreshBtn').onclick=()=>renderTable(page);

dashboard();
</script>
</body>
